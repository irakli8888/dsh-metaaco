<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>MetaACO · Запуски</title>
<style>
:root{color-scheme:dark;font:15px/1.5 system-ui;background:#101722;color:#e3eaf4}*{box-sizing:border-box}body{margin:0}header{padding:26px 32px;border-bottom:1px solid #304055;background:#152030}h1{font-size:25px;margin:0}small,.muted{color:#9eb0c7}main{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:85vh}aside{padding:20px;border-right:1px solid #304055}article{padding:24px 32px;max-width:1400px;width:100%}button,select,input{font:inherit;color:inherit;background:#1e2b3d;border:1px solid #40516b;border-radius:8px;padding:9px;max-width:100%}button{cursor:pointer}button:hover,button.active{background:#28475c;border-color:#5dd3bb}aside button{display:block;text-align:left;width:100%;margin:8px 0;font-size:13px;overflow-wrap:anywhere}h2{font-size:20px;margin:20px 0 10px}h3{font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0c121b;padding:16px;border-radius:8px;max-height:520px;overflow:auto;font:13px/1.6 ui-monospace,monospace}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.cards{display:flex;gap:12px;flex-wrap:wrap}.card{background:#1a2738;border:1px solid #304055;border-radius:10px;padding:15px;min-width:160px}.card strong{display:block;font-size:22px}.notice{border-left:3px solid #e3ba6e;padding:12px 16px;background:#29271f;margin:16px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #304055;vertical-align:top}svg{width:100%;background:#152030;border-radius:12px;min-height:220px}svg text{fill:#e3eaf4;font:14px system-ui}details{margin:12px 0}summary{cursor:pointer;color:#70d9c1}.bar{height:14px;background:#5bcdb5;border-radius:4px;min-width:2px}.row{margin:12px 0}.tag{font-size:12px;color:#70d9c1}a{color:#70d9c1}@media(max-width:800px){main{display:block}aside{max-height:260px;overflow:auto}article{padding:16px}header{padding:18px}}
</style>
<header><div class="tag">METAACO / НАБЛЮДАЕМОСТЬ</div><h1>Что произошло в каждом запуске</h1><small id="captured"></small></header>
<main><aside><input id="search" aria-label="Поиск запусков" placeholder="Поиск: fixed, metaaco…"><div id="list"></div></aside><article><div id="summary"></div><nav id="tabs"></nav><section id="content"></section></article></main>
<script id="data" type="application/json">/*INSPECTION_DATA*/</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id), el=(tag,text,parent)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e};
const pretty=x=>JSON.stringify(x,null,2), show=(parent,value)=>el('pre',typeof value==='string'?value:pretty(value),parent);
const artifact=(r,name)=>{try{return JSON.parse(r.artifacts.find(a=>a.name===name)?.text)}catch{return null}};
let selected=0, tab='graph';
const modes=r=>r.selection.mode??r.selection.policy??r.request.taskId;
const planning=r=>artifact(r,'planning')??artifact(r,'metaaco-dag-planning');
const finish=r=>r.events.find(e=>e.kind==='dag-finish-v1')?.payload;
const nodePlan=r=>artifact(r,'dag-plan');
$('captured').textContent=`Снимок ${new Date(data.capturedAt).toLocaleString('ru')} · ${data.runs.length} запусков · только чтение · не обновляется автоматически`;
function list(){ $('list').replaceChildren();data.runs.forEach((r,i)=>{if(!pretty([r.id,r.selection,r.request.taskId]).toLowerCase().includes($('search').value.toLowerCase()))return;const b=el('button',`${modes(r)} · ${r.state}\n${r.request.taskId} · ${r.id}`, $('list'));b.className=i===selected?'active':'';b.onclick=()=>{selected=i;list();render()}})}
$('search').oninput=list;
const sections=[['graph','Граф и путь'],['agents','Ответы и код'],['time','Время и стоимость'],['tests','Проверки'],['raw','Исходные данные']];
function notice(text){el('div',text,$('content')).className='notice'}
function details(name,value,parent=$('content')){const d=el('details',undefined,parent);el('summary',name,d);show(d,value)}
function graph(plan,r){if(!plan?.tasks){notice('Граф не сохранён для этого запуска.');return}const tasks=plan.tasks, levels=new Map();for(let pass=0;pass<tasks.length;pass++)for(const t of tasks)if(t.dependsOn.every(id=>levels.has(id)))levels.set(t.id,t.dependsOn.length?1+Math.max(...t.dependsOn.map(id=>levels.get(id))):0);
const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg'),positions=new Map(),counts={};
for(const t of tasks){const col=levels.get(t.id)??0,row=counts[col]??0;counts[col]=row+1;positions.set(t.id,{x:25+col*270,y:25+row*95})}
const height=Math.max(240,...Object.values(counts).map(n=>n*95+30)),width=Math.max(600,(Math.max(0,...levels.values())+1)*270+25);svg.setAttribute('viewBox',`0 0 ${width} ${height}`);svg.setAttribute('role','img');svg.setAttribute('aria-label','Граф зависимостей');
function shape(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;svg.append(e)}
for(const t of tasks){const p=positions.get(t.id);for(const dep of t.dependsOn){const a=positions.get(dep);if(a){shape('line',{x1:a.x+215,y1:a.y+30,x2:p.x,y2:p.y+30,stroke:'#6d91ad','stroke-width':2});shape('path',{d:`M ${p.x-8} ${p.y+25} L ${p.x} ${p.y+30} L ${p.x-8} ${p.y+35}`,fill:'none',stroke:'#6d91ad'})}}}
for(const t of tasks){const p=positions.get(t.id);shape('rect',{x:p.x,y:p.y,width:215,height:68,rx:9,fill:'#22394a',stroke:'#5dd3bb'});shape('text',{x:p.x+12,y:p.y+25},t.id);shape('text',{x:p.x+12,y:p.y+48},`${t.model?.model??'модель не указана'} · слоты ${t.slots}`)}$('content').append(svg)}
function render(){const r=data.runs[selected];if(!r)return;const p=planning(r),plan=nodePlan(r),f=finish(r);$('summary').replaceChildren();el('h2',`${r.request.taskId} / ${modes(r)}`,$('summary'));el('small',`Начало: ${r.startedAt} · ID: ${r.id}`,$('summary'));const cards=el('div',undefined,$('summary'));cards.className='cards';for(const [label,value]of [['Состояние попытки',r.state],['Исполнение DAG',f?.status??'нет данных'],['Качество',r.evaluation?.status??'нет оценки']]){const c=el('div',label,cards);c.className='card';el('strong',value,c)}$('tabs').replaceChildren();for(const [id,title]of sections){const b=el('button',title,$('tabs'));b.className=tab===id?'active':'';b.onclick=()=>{tab=id;render()}}$('content').replaceChildren();
if(tab==='graph'){notice('Граф задан разработчиком. MetaACO выбирает приоритеты фиксированных задач; структура графа и модели здесь не оптимизируются.');const original=data.sources[r.source].manifest?.problem?.plan;el('h3',original?'Входной граф из manifest':'Сохранённый граф исполнения',$('content'));graph(original??plan,r);if(!original)notice('Отдельный исходный граф до планирования не найден. Показан dag-plan.');el('h3','Выбранный порядок запуска',$('content'));show($('content'),plan?.tasks?.map(t=>t.id).join(' → ')??'Не сохранён');el('p','Это приоритет среди готовых задач, а не запрет параллельности.',$('content'));if(p){details('Прогноз расписания и параметры решателя',p);notice('Полная история отдельных муравьёв не записана. Доступно итоговое расписание, seed, параметры и хеши solver.')}else if(!artifact(r,'template-selection')?.trace) notice('План MetaACO не сохранён; для Fixed поиск не выполняется.');const skillSearch=artifact(r,'template-selection');if(skillSearch?.trace?.schemaVersion===1){
  const trace=skillSearch.trace;
  el('h3','Поиск графа MetaACO',$('content'));
  el('p',`Оценок: ${skillSearch.evaluations} · в отчёте: ${trace.evaluations.length} · пропущено: ${trace.omitted}`,$('content'));
  details('Выбранные навыки и приоритеты',{choices:skillSearch.choices,dispatchOrder:skillSearch.dispatchOrder});
  for(const row of trace.evaluations){
    const status=row.rejected==='over-budget'?'сверх бюджета':`прогноз ${row.makespanSeconds} с`;
    details(`Оценка ${row.evaluation} · ${status}`,row);
  }
}details('Задача и решение выбора', {request:r.request,selection:r.selection});}
if(tab==='agents'){notice('Ниже сохранённые задания узлов и ответы. Полный HTTP-запрос с обёрткой промпта не записан; он не восстанавливается по догадке.');for(const t of plan?.tasks??[]){el('h3',`${t.id} · ${t.model?.model??'не указана'}`,$('content'));details('Задание узла',t.prompt);details('Зависимости и входные артефакты',{dependsOn:t.dependsOn,inputs:t.inputs});const a=r.artifacts.find(a=>a.name===`dag-output/${t.id}`);if(a){show($('content'),a.error??a.text);try{const obj=JSON.parse(a.text);for(const [name,text]of Object.entries(obj.files??{}))details(`Файл: ${name}`,text)}catch{}}else el('p','Ответ не сохранён.',$('content'));}if(!plan)notice('План не найден. Все доступные файлы находятся в «Исходные данные».');}
if(tab==='time'){const nodes=f?.tasks??r.events.filter(e=>e.kind==='dag-task-v1'&&e.payload.wallTimeMs!==null).map(e=>e.payload);el('h3','Измеренная длительность узлов',$('content'));const max=Math.max(1,...nodes.map(n=>n.wallTimeMs??0));for(const n of nodes){el('div',`${n.id}: ${n.wallTimeMs===null?'неизвестно':(n.wallTimeMs/1000).toFixed(3)+' с'} · ${n.state}`,$('content'));const bar=el('div',undefined,$('content'));bar.className='bar';bar.style.width=`${Math.max(1,(n.wallTimeMs??0)/max*100)}%`;}el('p','Полосы показывают длительность, не синхронную временную шкалу.',$('content'));details('Измерения и прогнозы из outcome',r.outcome);const calls=r.events.filter(e=>e.kind==='metrics-v1'&&e.payload.data.type==='call').map(e=>e.payload.data.record);el('h3',`API-вызовы: ${calls.length}`,$('content'));notice('Стоимость рассчитана по usage и тарифу; это не подтверждённый счёт провайдера. Неизвестные значения не считаются нулём.');for(const c of calls)details(`${c.model} · ${c.status} · ${c.latencyMs?.toFixed(0)??'?'} мс`,c);if(p)details('Прогноз MetaACO',p.estimates);}
if(tab==='tests'){notice(r.evaluation?.status==='success'?'Есть сохранённая оценка success — проверьте доказательства ниже.':'Успешное исполнение Harness не доказывает качество кода. Неустановленное качество: inconclusive.');show($('content'),r.evaluation);const evidence=r.artifacts.filter(a=>/evaluat|test|snapshot/.test(a.name));for(const a of evidence)details(a.name,a.error??a.text);if(!evidence.length)el('p','Независимые тестовые отчёты для этого запуска не сохранены.',$('content'));}
if(tab==='raw'){details('Источник и manifest',data.sources[r.source]);details('События банка',r.events);for(const a of r.artifacts)details(`${a.name} · ${a.sha256.slice(0,12)} · ${a.size_bytes} байт`,a.error??a.text);notice('Этот файл содержит промпты и ответы выбранных запусков. Храните его приватно. Он не обращается к сети.');}}
list();render();
</script></html>
